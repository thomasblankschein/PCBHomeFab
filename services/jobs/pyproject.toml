[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcbhomefab-jobs"
version = "1.0.0"
description = "PCBHomeFab jobs service: jobs of logged-in users and the workflow"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "pyjwt[crypto]>=2.8",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "jsonschema>=4.18",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["reportlab", "reportlab.*"]
ignore_missing_imports = true
