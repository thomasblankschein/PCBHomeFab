# PCBHomeFab tool library.
#
# One [[tool]] entry per drill bit or end mill. Values from [defaults.drill] / [defaults.endmill] apply to every tool
# of that kind unless the tool sets them itself. Add tools, change values or set `enabled = false` to hide a tool.
#
# Drill:   spindle_rpm, plunge_feed (mm/min), peck_mm (0 = drill in one go)
# End mill: spindle_rpm, feed (mm/min, in the material), plunge_feed (mm/min), step_down_mm (depth per pass)
#
# The numbers are starting values for a 3018 hobby mill with 1.6 mm FR4. Tune them for your machine.
# Use a copy of this file with PCBHOMEFAB_TOOLS_FILE=/path/to/tools.toml (or `pcbhomefab mill --tools FILE`).

[defaults.drill]
spindle_rpm = 20000
plunge_feed = 50
peck_mm = 0.7

[defaults.endmill]
spindle_rpm = 20000
feed = 70
plunge_feed = 50
step_down_mm = 0.4

[[tool]]
id = "drill-0.6"
kind = "drill"
diameter_mm = 0.6
peck_mm = 0.5

[[tool]]
id = "drill-0.7"
kind = "drill"
diameter_mm = 0.7
peck_mm = 0.5

