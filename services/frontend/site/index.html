<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCBHomeFab</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
<h1>PCBHomeFab</h1>
<p>Gerber ZIP in, exposure file (<code>.pm3</code>) and drill/mill G-code out.</p>
<form id="upload">
  <p><label>Gerber ZIP <input type="file" name="boards" accept=".zip" required></label></p>
  <p><label>Copies <input type="number" name="counts" value="1" min="1" max="200"></label></p>
  <p><label>Exposure time (s) <input type="number" name="exposure_s" value="120" min="1" max="3600"></label></p>
  <p><button type="submit">Create job</button></p>
  <p id="error" class="error" role="alert" hidden></p>
</form>
</main>
<script src="/index.js"></script>
</body>
</html>
