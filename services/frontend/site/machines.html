<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title data-i18n="machines.page_title">Machines - PCBHomeFab</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">PCBHomeFab</a>
  <nav aria-label="Main" data-i18n-attr="aria-label:nav.main">
    <a href="/" data-i18n="nav.new_job">New job</a>
    <a href="/tools" data-i18n="nav.tools">Tools</a>
    <a href="/machines" aria-current="page" data-i18n="nav.machines">Machines</a>
  </nav>
</header>
<main>
<h1 data-i18n="machines.heading">Machines</h1>
<p class="lead" data-i18n="machines.lead">Parameters of the printers and mills the files are made for. Calibration values can be changed for a single job under Settings on the New job page.</p>
<p id="load-error" class="error" role="alert"></p>
<div id="machines"></div>
<h2 data-i18n="machines.plates">Plate sizes</h2>
<p id="plates-source" class="muted"></p>
<div class="table-wrap">
<table id="plates" class="tools" hidden>
  <thead>
    <tr>
      <th data-i18n="machines.col_name">Name</th>
      <th class="num" data-i18n="machines.col_width">Width</th>
      <th class="num" data-i18n="machines.col_height">Height</th>
      <th data-i18n="machines.col_id">Id</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
</div>
</main>
<footer class="foot"><a href="https://github.com/thomasblankschein/PCBHomeFab">PCBHomeFab</a> <span id="version"></span></footer>
<script type="module" src="/js/footer.js"></script>
<script type="module" src="/js/machines.js"></script>
</body>
</html>
