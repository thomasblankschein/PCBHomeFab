[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcbhomefab"
version = "0.1.0"
description = "Gerber to UV exposure masks (.pm3) and drill/mill G-code for home PCB fabrication"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Thomas Blankschein" }]
dependencies = [
    "gerbonara>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
pcbhomefab = "pcbhomefab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pcbhomefab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["gerbonara", "gerbonara.*"]
ignore_missing_imports = true
