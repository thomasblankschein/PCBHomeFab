[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcbhomefab"
version = "0.1.0"
description = "Gerber to UV exposure masks (.pm3) and drill/mill G-code for home PCB fabrication"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Thomas Blankschein" }]
dependencies = [
    "gerbonara>=1.6",
    "pillow>=10.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
dev = [
    "pcbhomefab[web]",
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
pcbhomefab = "pcbhomefab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pcbhomefab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["gerbonara", "gerbonara.*"]
ignore_missing_imports = true
