name: CI architecture

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Contracts are valid (schemas, OpenAPI, examples)
        run: python scripts/check_contracts.py
      - name: No cross-service code, one volume per service, only the gateway is published
        run: python scripts/check_boundaries.py
      - name: Compose file is valid
        run: |
          echo "PCBHOMEFAB_PUBLIC_URL=http://localhost" > .env
          echo "KEYCLOAK_ADMIN_PASSWORD=ci-admin-password" >> .env
          echo "KEYCLOAK_DB_PASSWORD=ci-db-password" >> .env
          docker compose config -q
