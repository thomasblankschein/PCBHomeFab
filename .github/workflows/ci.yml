name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t pcbhomefab:latest .
      - name: Smoke test the single container
        run: |
          docker run -d --name pcbhomefab -p 8000:8000 -e PCBHOMEFAB_IP_SALT=ci pcbhomefab:latest
          scripts/smoke_test.sh http://localhost:8000 || (docker logs pcbhomefab; exit 1)
          docker rm -f pcbhomefab
      - name: Smoke test the compose setup (proxy, web, worker)
        run: |
          echo "PCBHOMEFAB_IP_SALT=ci" > .env
          echo "SITE_ADDRESS=:80" >> .env
          docker compose up -d --build
          scripts/smoke_test.sh http://localhost || (docker compose logs; exit 1)
          docker compose down -v
