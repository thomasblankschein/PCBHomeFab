name: CI mill

on:
  push:
    branches: [main]
    paths:
      - "services/mill/**"
      - "contracts/**"
      - ".github/workflows/ci-mill.yml"
  pull_request:
    paths:
      - "services/mill/**"
      - "contracts/**"
      - ".github/workflows/ci-mill.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: services/mill
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/mill/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pcbhomefab-mill services/mill
