# Updates of the base images and of the actions, once a month. The Python packages have only lower bounds (no lock
# files), so each build takes the newest versions anyway; GitHub reports known vulnerabilities of them separately.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /services/gateway
      - /services/frontend
      - /services/keycloak
      - /services/jobs
      - /services/ingest
      - /services/panel
      - /services/exposure
      - /services/mill
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      # A new major version of PostgreSQL needs a migration of the Keycloak database (dump and restore or pg_upgrade), and
      # the image of 18 expects its volume at /var/lib/postgresql instead of .../data. Version 17 is supported until
      # November 2029; updates within 17 still come.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
