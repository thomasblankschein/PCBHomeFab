openapi: 3.1.0
info:
  title: PCBHomeFab jobs
  version: 1.0.0
  description: >
    The API the browser uses (behind the gateway under /api). Anonymous: creating a job returns a random id and the
    job link is the only credential. Jobs and their files expire. Runs the workflow ingest, panel, exposure and
    mill and is the only service with state.
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: The service is running.
  /v1/profiles:
    get:
      operationId: listProfiles
      responses:
        "200":
          description: Printer and mill profiles (from exposure and mill) and the limits of this installation.
          content:
            application/json:
              schema:
                type: object
                required: [printers, mills, limits]
                properties:
                  printers: {type: object}
                  mills: {type: object}
                  limits: {type: object}
  /v1/plates:
    get:
      operationId: listPlates
      description: >
        The plate sizes the user can choose from. They are data of this service: the packaged `plates.toml` or the
        file named by PCBHOMEFAB_PLATES_FILE. The first enabled plate is the default.
      responses:
        "200":
          description: The plate sizes (disabled entries are left out).
          content:
            application/json:
              schema:
                type: object
                required: [source, plates]
                properties:
                  source: {type: string}
                  plates:
                    type: array
                    items:
                      type: object
                      required: [id, name, width_mm, height_mm]
                      properties:
                        id: {type: string}
                        name: {type: string}
                        width_mm: {type: number}
                        height_mm: {type: number}
  /v1/tools:
    get:
      operationId: listTools
      responses:
        "200":
          description: The tool library of the mill service.
          content:
            application/json:
              schema:
                type: object
  /v1/boards:
    post:
      operationId: getBoardInfo
      description: >
        Size, holes and real contour of one Gerber ZIP (the board.json of the canonical package), for the layout
        preview of the user interface. Nothing is stored. Limited per client.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200":
          description: board.json
          content:
            application/json:
              schema:
                $ref: schemas/board.schema.json
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/layouts:
    post:
      operationId: previewLayout
      description: >
        Where the boards would sit on the plate, as the panel service places them. Nothing is stored. Limited per
        client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: schemas/preview-layout-request.schema.json
      responses:
        "200":
          description: The placements.
          content:
            application/json:
              schema:
                $ref: schemas/layout.schema.json
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/jobs:
    post:
      operationId: createJob
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [boards, plate]
              properties:
                boards:
                  type: array
                  items: {type: string, format: binary}
                  description: Gerber ZIP files or KiCad PCB files (.kicad_pcb), one per board design.
                plate: {type: string, description: Id of a plate size, see GET /v1/plates.}
                counts:
                  type: array
                  items: {type: integer, minimum: 1}
                  description: Copies per file, same order (default 1 each).
                printer: {type: string, default: photon-m3}
                mill: {type: string, default: 3018pro}
                exposure: {type: boolean, default: true}
                mill_gcode: {type: boolean, default: true}
                exposure_s: {type: number, minimum: 1, maximum: 3600, default: 120}
                holes: {type: string, enum: [full, center, none], default: full}
                gap_mm: {type: number, minimum: 0.5, maximum: 20, default: 3}
                margin_mm: {type: number, minimum: 0, maximum: 20, default: 3}
                flip: {type: string, enum: [x, y, none], default: x}
                thickness_mm: {type: number, minimum: 0.4, maximum: 3.2, default: 1.6}
                tabs: {type: boolean, default: true}
                mark_labels: {type: boolean, default: true, description: Write the G-code coordinates of the mark next to each positioning mark on the copper layer (mirrored so that they read correctly on the finished copper). Only with marks.}
                drill_map: {type: string, description: 'JSON object {hole diameter in mm: diameter of the drill to use}. For holes without a drill of their own size in the tool library; without a mapping such a board is refused (mill.no_drill).'}
                marks: {type: boolean, default: true, description: Add positioning marks to the copper layer; X0 Y0 of the G-code is then the centre of the lower left mark. Needs a margin of at least 4.5 mm.}
                frame_left_mm: {type: number, minimum: 0, maximum: 20}
                frame_bottom_mm: {type: number, minimum: 0, maximum: 20}
                mirror_x: {type: boolean}
      responses:
        "201":
          description: The job was queued.
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: {type: string}
                  status: {type: string}
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/jobs/{id}:
    get:
      operationId: getJob
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Job state.
          content:
            application/json:
              schema:
                $ref: schemas/job.schema.json
        "404":
          $ref: "#/components/responses/Problem"
  /v1/jobs/{id}/files/{name}:
    get:
      operationId: getJobFile
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The file of a finished job.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Problem"
  /v1/jobs/{id}/archive:
    get:
      operationId: getJobArchive
      summary: All result files of a finished job in one ZIP archive
      description: Folders `exposure/` (exposure.pm3, mask.png, mask_preview.png) and `drill-mill/` (the G-code programs and mill_preview.svg).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The ZIP archive.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Problem"
components:
  responses:
    Problem:
      description: Error, codes in errors.md.
      content:
        application/problem+json:
          schema:
            $ref: schemas/problem.schema.json
