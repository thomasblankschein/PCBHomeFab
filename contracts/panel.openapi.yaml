openapi: 3.1.0
info:
  title: PCBHomeFab panel
  version: 1.0.0
  description: >
    Places boards on the plate in rows from the lower left corner, left to right, new rows going up.
    Pure function, stateless.
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: The service is running.
  /v1/layouts:
    post:
      operationId: createLayout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: schemas/layout-request.schema.json
      responses:
        "200":
          description: The placements.
          content:
            application/json:
              schema:
                $ref: schemas/layout.schema.json
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
components:
  responses:
    Problem:
      description: Error, codes in errors.md.
      content:
        application/problem+json:
          schema:
            $ref: schemas/problem.schema.json
